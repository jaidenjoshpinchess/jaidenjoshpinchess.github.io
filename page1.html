<!DOCTYPE html>
<html>
<head>
  <title>photography</title>

  <style>
    body {
      margin: 0;
      font-family: "Courier New", Courier, monospace;
      background: black;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      font-size: 3em;
    }

    .nav-buttons {
      margin: 20px 0;
    }

    .nav-buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 20px;
      background: white;
      color: black;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s;
    }

    .nav-buttons a:hover {
      background: #ddd;
      transform: scale(1.05);
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 20px;
      margin-top: 20px;
      box-shadow: 0 10px 25px rgba(255,255,255,0.15);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Photography</h1>

    <div class="nav-buttons">
      <a href="index.html">← Home</a>
    </div>

    <!-- Example image -->
    <img src="IMG_9252.JPG">
  </div>
</body>
</html>
